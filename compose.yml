services:
    postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        environment:
            POSTGRES_USER: tenant_management
            POSTGRES_PASSWORD: tenant_management
            POSTGRES_DB: tenant_management
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U tenant_management -d tenant_management"]
            interval: 5s
            timeout: 5s
            retries: 10
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql

    migrate:
        image: migrate/migrate:v4.19.1@sha256:cc4ad8e19d66791e3689405d9a028ce6e9614f32032db14acda1469f7201d6e4
        command:
            [
                "-path",
                "/migrations",
                "-database",
                "postgres://tenant_management:tenant_management@postgres:5432/tenant_management?sslmode=disable",
                "up",
            ]
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./migrations:/migrations:ro

    server:
        build:
            context: .
        environment:
            DATABASE_URL: postgres://tenant_management:tenant_management@postgres:5432/tenant_management?sslmode=disable
            SERVER_ADDR: :8080
        depends_on:
            migrate:
                condition: service_completed_successfully
        ports:
            - "8080:8080"

volumes:
    postgres-data:
