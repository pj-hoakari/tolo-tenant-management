name: Check Generated Code

on:
    pull_request:
        paths:
            - "proto/**"
            - "gen/**"
            - "buf.yaml"
            - "buf.gen.go.yaml"
            - "go.mod"
            - "go.sum"
            - "Taskfile.yml"
            - ".github/workflows/proto-gen-check.yml"
    push:
        branches: [main]
        paths:
            - "proto/**"
            - "gen/**"
            - "buf.yaml"
            - "buf.gen.go.yaml"
            - "go.mod"
            - "go.sum"
            - "Taskfile.yml"
            - ".github/workflows/proto-gen-check.yml"

permissions:
    contents: read

jobs:
    drift-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up buf
              uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
              with:
                  setup_only: true
                  version: 1.70.0
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Go
              uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
              with:
                  go-version-file: go.mod

            - name: Set up Task
              uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Lint proto
              run: task proto:lint

            - name: Regenerate connect-go code
              run: task proto:gen:go

            - name: Verify generated code is up to date
              run: |
                  if [ -n "$(git status --porcelain -- gen/)" ]; then
                    echo "::error::gen/ が最新ではありません"
                    git status --porcelain -- gen/
                    git diff -- gen/
                    exit 1
                  fi
