version: "2"

linters:
    default: standard
    enable:
        - wsl_v5
        - bodyclose
        - contextcheck
        - fatcontext
        - containedctx
        - exhaustruct
        - exhaustive
        - forbidigo
        - gosec
        - nilnil
        - nilerr
        - nlreturn
    settings:
        errcheck:
            check-type-assertions: true
            check-blank: true
            disable-default-exclusions: true
            exclude-functions:
                - fmt.Print
                - fmt.Printf
                - fmt.Println
        forbidigo:
            forbid:
                # Internal errors must go through connect.InternalError so the
                # cause is logged server-side and never reaches the client.
                - pattern: '^connectrpc\.CodeInternal$'
                  msg: "build internal errors with InternalError(ctx, err) instead of connectrpc.CodeInternal"
                # Logging goes through log/slog, so that every record comes out
                # in the structure Cloud Logging parses and carries the trace of
                # its request context.
                - pattern: '^log\.[A-Z]\w*$'
                  msg: "use log/slog (internal/logging) instead of the standard log package"
                # Establishing the tenant boundary is the transport's job.
                # Below it the boundary is only read, so a use case or a
                # repository cannot widen the tenant it was called for.
                - pattern: '^tenantctx\.WithTenantPublicID$'
                  msg: "tenant binding is the transport's job; only the HTTP API handler may bind a tenant without a JWT"
        exhaustruct:
            exclude:
                - 'crypto/tls\.Config'
                - 'log/slog\.HandlerOptions'
                - 'net/http\.Server'
                - 'net/http\.Client'
                - 'net/http\.Transport'
        wsl_v5:
            allow-first-in-block: true
            allow-whole-block: false
            branch-max-lines: 2
    exclusions:
        rules:
            # The one transport whose callers carry no internal JWT, and
            # therefore the one place allowed to bind the tenant itself.
            - path: internal/relation/infra/httpapi/handler\.go
              linters:
                  - forbidigo
              text: WithTenantPublicID
            - path: _test\.go
              linters:
                  - errcheck
                  - exhaustruct
                  - forbidigo
                  - gosec
                  - staticcheck
                  - fatcontext
                  - containedctx
