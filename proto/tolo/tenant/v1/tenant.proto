syntax = "proto3";

package tolo.tenant.v1;

import "authz/v1/options.proto";
import "google/protobuf/timestamp.proto";

// TenantService is the source of truth for tenant and event identifiers.
//
// Every tenant_id / event_id field carries the public ID (a random
// 16-character hexadecimal string). Internal primary keys never appear on the
// wire. Tenant-scoped RPCs take the target tenant in the request and the
// service cross-checks it against the tenant_id claim of the internal JWT.
service TenantService {
  // StartTenantRegistration creates a pending_owner tenant without
  // authentication and returns a one-time ownership claim token.
  rpc StartTenantRegistration(StartTenantRegistrationRequest) returns (StartTenantRegistrationResponse) {
    option (authz.v1.auth_policy) = { level: AUTH_LEVEL_PUBLIC };
  }
  // ClaimTenantOwnership turns a pending_owner tenant into an owned tenant
  // and registers the authenticated user as its owner. It requires
  // token_use=registration, which carries no tenant context.
  rpc ClaimTenantOwnership(ClaimTenantOwnershipRequest) returns (ClaimTenantOwnershipResponse) {
    option (authz.v1.auth_policy) = {
      level: AUTH_LEVEL_AUTHENTICATED
      required_scopes: "tenant.claim"
      token_uses: "registration"
    };
  }
  rpc ResolveTenantSubdomain(ResolveTenantSubdomainRequest) returns (ResolveTenantSubdomainResponse) {
    option (authz.v1.auth_policy) = { level: AUTH_LEVEL_PUBLIC };
  }
  rpc ChangeTenantContract(ChangeTenantContractRequest) returns (ChangeTenantContractResponse) {
    option (authz.v1.auth_policy) = {
      level: AUTH_LEVEL_AUTHENTICATED
      required_scopes: "tenant.write"
      token_uses: "tenant_access"
    };
  }
  rpc ArchiveTenant(ArchiveTenantRequest) returns (ArchiveTenantResponse) {
    option (authz.v1.auth_policy) = {
      level: AUTH_LEVEL_AUTHENTICATED
      required_scopes: "tenant.write"
      token_uses: "tenant_access"
    };
  }
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse) {
    option (authz.v1.auth_policy) = {
      level: AUTH_LEVEL_AUTHENTICATED
      required_scopes: "events.manage"
      token_uses: "tenant_access"
    };
  }
  rpc TransitionEventStatus(TransitionEventStatusRequest) returns (TransitionEventStatusResponse) {
    option (authz.v1.auth_policy) = {
      level: AUTH_LEVEL_AUTHENTICATED
      required_scopes: "events.manage"
      token_uses: "tenant_access"
    };
  }
  // GetEvent is the referential-integrity read used by Graph Authoring. It
  // requires token_use=service with tenant context.
  rpc GetEvent(GetEventRequest) returns (GetEventResponse) {
    option (authz.v1.auth_policy) = { level: AUTH_LEVEL_INTERNAL };
  }
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (authz.v1.auth_policy) = {
      level: AUTH_LEVEL_AUTHENTICATED
      required_scopes: "events.read"
      token_uses: "tenant_access"
    };
  }
}

// Tenant is the customer-organization, billing, and onboarding boundary.
message Tenant {
  string tenant_id = 1;      // public ID (random 16-character hex)
  string name = 2;           // display only; duplicates are allowed
  string contract_plan = 3;  // identifier only; billing details are out of scope
  bool archived = 4;
  TenantOwnershipState ownership_state = 5;
  string subdomain = 6;
}

enum TenantOwnershipState {
  TENANT_OWNERSHIP_STATE_UNSPECIFIED = 0;
  // Created without authentication; not usable for business operations yet.
  TENANT_OWNERSHIP_STATE_PENDING_OWNER = 1;
  // An authenticated owner membership exists; the tenant is usable.
  TENANT_OWNERSHIP_STATE_OWNED = 2;
}

// Event is an installation or occasion owned by exactly one tenant.
message Event {
  string event_id = 1;   // public ID (random 16-character hex)
  string tenant_id = 2;  // public ID of the owning tenant
  string name = 3;
  EventStatus status = 5;

  reserved 4;
  reserved "type";
}

enum EventStatus {
  EVENT_STATUS_UNSPECIFIED = 0;
  EVENT_STATUS_DRAFT = 1;
  EVENT_STATUS_OPEN = 2;
  EVENT_STATUS_LOCKED = 3;
  EVENT_STATUS_CLOSED = 4;
  EVENT_STATUS_ARCHIVED = 5;  // soft delete
}

message StartTenantRegistrationRequest {
  string name = 1;
  string contract_plan = 2;
}
message StartTenantRegistrationResponse {
  Tenant tenant = 1;                 // ownership_state is PENDING_OWNER
  string ownership_claim_token = 2;  // one-time; never returned again
  google.protobuf.Timestamp expires_at = 3;
}

message ClaimTenantOwnershipRequest {
  string tenant_id = 1;
  string ownership_claim_token = 2;
  string subdomain = 3;
}
message ClaimTenantOwnershipResponse { Tenant tenant = 1; }

message ResolveTenantSubdomainRequest { string subdomain = 1; }
message ResolveTenantSubdomainResponse { string tenant_id = 1; }

message ChangeTenantContractRequest {
  string tenant_id = 1;
  string contract_plan = 2;
}
message ChangeTenantContractResponse { Tenant tenant = 1; }

message ArchiveTenantRequest { string tenant_id = 1; }
message ArchiveTenantResponse { Tenant tenant = 1; }

message CreateEventRequest {
  string tenant_id = 1;
  string name = 2;

  reserved 3;
  reserved "type";
}
message CreateEventResponse { Event event = 1; }

message TransitionEventStatusRequest {
  string event_id = 1;
  EventStatus to = 2;  // the server validates the transition table
}
message TransitionEventStatusResponse { Event event = 1; }

message GetEventRequest { string event_id = 1; }
message GetEventResponse { Event event = 1; }

message ListEventsRequest {
  string tenant_id = 1;
  bool include_archived = 2;  // default false: archived events are omitted
}
message ListEventsResponse { repeated Event events = 1; }
